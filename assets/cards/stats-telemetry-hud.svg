<svg xmlns="http://www.w3.org/2000/svg" width="495" height="215" viewBox="0 0 495 215" fill="none">
  <defs>
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cyber-top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <linearGradient id="stats-hud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="stats-hud-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#30363d" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="stats-hud-tile-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#21262d" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="stats-hud-brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="stats-hud-glow-tl" cx="0%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="stats-hud-glow-br" cx="100%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <pattern id="stats-hud-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#8b949e" fill-opacity="0.12" />
    </pattern>
  
  </defs>

  <style>
    
    .font-ui { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-weight: 700; font-size: 9px; fill: #8b949e; letter-spacing: 0.08em; text-transform: uppercase; }
    .stat-val { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-weight: 800; font-size: 14px; fill: #58a6ff; font-variant-numeric: tabular-nums; }
    .meta-text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-size: 10.5px; font-weight: 500; fill: #8b949e; }
    @keyframes statusPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    .pulse-dot { animation: statusPulse 2.2s ease-in-out infinite; }
    
  
    .hud-title { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 16px; fill: #58a6ff; }
    .hud-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .hud-val { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-weight: 800; font-size: 17px; fill: #58a6ff; font-variant-numeric: tabular-nums; }
    .hud-grade { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-weight: 900; font-size: 30px; fill: #58a6ff; }
  </style>

  <rect x="0.5" y="0.5" rx="14" width="494" height="214" fill="url(#cyber-bg)" stroke="#30363d"/>
  <path d="M 14,0.5 L 481,0.5" stroke="url(#cyber-top-bar)" stroke-width="3" stroke-linecap="round"/>

  <!-- Tactical Brackets -->
  <path d="M 12,5 L 5,5 L 5,12" fill="none" stroke="#3fb950" stroke-width="1.5" opacity="0.65"/>
  <path d="M 483,5 L 490,5 L 490,12" fill="none" stroke="#3fb950" stroke-width="1.5" opacity="0.65"/>
  <path d="M 5,203 L 5,210 L 12,210" fill="none" stroke="#3fb950" stroke-width="1.5" opacity="0.65"/>
  <path d="M 490,203 L 490,210 L 483,210" fill="none" stroke="#3fb950" stroke-width="1.5" opacity="0.65"/>

  <!-- Header -->
  <g transform="translate(24, 0)">
    <text class="hud-mono" x="0" y="22" font-size="9" font-weight="700" letter-spacing="1.2" fill="#3fb950">SYS.DEV // TELEMETRY HUD</text>
    <text class="hud-title" x="0" y="42">Tan Thang Le <tspan fill="#8b949e" font-size="12.5" font-weight="500">(@cubewin07)</tspan></text>
  </g>

  <!-- Live Status Beacon Capsule -->
  <g transform="translate(337, 18)">
    <rect x="0" y="0" width="134" height="24" rx="12" fill="#0c1624" stroke="#30363d" stroke-width="1.2"/>
    <circle cx="14" cy="12" r="3.5" fill="#22c55e"/>
    <circle cx="14" cy="12" r="3.5" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.6">
      <animate attributeName="r" values="3.5;9" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text class="hud-mono" x="25" y="15.5" font-size="9.5" font-weight="800" letter-spacing="0.5" fill="#3fb950">⚡ 1,533 IMPACT</text>
  </g>

  <line x1="24" y1="54" x2="471" y2="54" stroke="#21262d" stroke-width="1" opacity="0.6"/>

  <!-- Zone A: Proportional Tactical Bento Modules -->
  <g transform="translate(24, 66)">
    <!-- Module 1: Contributions -->
    
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="137" height="58" rx="6" fill="#161b22" fill-opacity="0.82" stroke="url(#stats-hud-tile-rim)" stroke-width="1" />
      <line x1="8" y1="0.75" x2="129" y2="0.75" stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.75" />
      <rect x="0.5" y="6" width="3" height="46" rx="1.5" fill="#3fb950" opacity="0.9" />
      
        <g transform="translate(10, 8)">
          <text class="hud-mono" x="0" y="10" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#8b949e">CONTRIBUTIONS</text>
          <text class="hud-val" x="0" y="33">1,533</text>
        </g>
      
    </g>
  

    <!-- Module 2: Commits -->
    
    <g transform="translate(147, 0)">
      <rect x="0" y="0" width="137" height="58" rx="6" fill="#161b22" fill-opacity="0.82" stroke="url(#stats-hud-tile-rim)" stroke-width="1" />
      <line x1="8" y1="0.75" x2="129" y2="0.75" stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.75" />
      <rect x="0.5" y="6" width="3" height="46" rx="1.5" fill="#00f2fe" opacity="0.9" />
      
        <g transform="translate(10, 8)">
          <text class="hud-mono" x="0" y="10" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#8b949e">COMMITS PUSHED</text>
          <text class="hud-val" x="0" y="33">1,246</text>
        </g>
      
    </g>
  

    <!-- Module 3: Pull Requests -->
    
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="137" height="58" rx="6" fill="#161b22" fill-opacity="0.82" stroke="url(#stats-hud-tile-rim)" stroke-width="1" />
      <line x1="8" y1="0.75" x2="129" y2="0.75" stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.75" />
      <rect x="0.5" y="6" width="3" height="46" rx="1.5" fill="#a855f7" opacity="0.9" />
      
        <g transform="translate(10, 8)">
          <text class="hud-mono" x="0" y="10" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#8b949e">PULL REQUESTS</text>
          <text class="hud-val" x="0" y="33">42</text>
          <text class="hud-mono" x="117" y="33" text-anchor="end" fill="#8b949e" font-size="10" font-weight="600">+1 Reviews</text>
        </g>
      
    </g>
  

    <!-- Module 4: Streak -->
    
    <g transform="translate(147, 68)">
      <rect x="0" y="0" width="137" height="58" rx="6" fill="#161b22" fill-opacity="0.82" stroke="url(#stats-hud-tile-rim)" stroke-width="1" />
      <line x1="8" y1="0.75" x2="129" y2="0.75" stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.75" />
      <rect x="0.5" y="6" width="3" height="46" rx="1.5" fill="#f59e0b" opacity="0.9" />
      
        <g transform="translate(10, 8)">
          <text class="hud-mono" x="0" y="10" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#8b949e">ACTIVE STREAK</text>
          <text class="hud-val" x="0" y="33">0d</text>
          <text class="hud-mono" x="117" y="33" text-anchor="end" fill="#8b949e" font-size="10" font-weight="600">Peak: 18d</text>
        </g>
      
    </g>
  
  </g>

  <!-- Zone B: Radial Gauge Bento Pod -->
  <g transform="translate(323, 66)">
    
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="148" height="126" rx="8" fill="#161b22" fill-opacity="0.82" stroke="url(#stats-hud-tile-rim)" stroke-width="1" />
      <line x1="10" y1="0.75" x2="138" y2="0.75" stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.75" />
      
      
        <g transform="translate(74, 46)">
          <circle cx="0" cy="0" r="36" fill="none" stroke="#21262d" stroke-width="6.5"/>
          <circle cx="0" cy="0" r="36" fill="none" stroke="#3fb950" stroke-width="6.5"
                  stroke-dasharray="226.2" stroke-dashoffset="190.0"
                  stroke-linecap="round" transform="rotate(-90)" />
          
          <text class="hud-grade" x="0" y="10" text-anchor="middle">C</text>
        </g>
        <text class="hud-mono" x="74" y="101" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8b949e">OVERALL RANK</text>
        <text class="hud-mono" x="74" y="115" text-anchor="middle" font-size="8" font-weight="700" fill="#3fb950">SCORE 16.1/100 • TOP 84%</text>
      
    </g>
  
  </g>
</svg>