name: Generate & Update README Banner

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/cards/banner/**'
      - 'scripts/generate-banner.js'
      - '.github/workflows/generate-banner.yml'

permissions:
  contents: write

concurrency:
  group: 'banner-regeneration'
  cancel-in-progress: true

jobs:
  update-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate animated SVG banner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run generate:banner -- --user=${{ github.repository_owner }}

      - name: Commit and push banner update
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add banner.svg dist/banner.svg 2>/dev/null || git add banner.svg
          if git diff --staged --quiet; then
            echo "No changes in generated banner.svg."
          else
            git commit -m "chore(banner): auto-regenerate animated README banner [skip ci]"
            git push origin main
          fi
