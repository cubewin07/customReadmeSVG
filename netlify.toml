[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route card endpoints to Netlify Function
[[redirects]]
  from = "/:user"
  to = "/.netlify/functions/card"
  status = 200

[[redirects]]
  from = "/:user/:card"
  to = "/.netlify/functions/card"
  status = 200
