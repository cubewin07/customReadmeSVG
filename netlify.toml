[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# 1. Force static asset files to be served directly from dist/
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# 2. Direct card endpoints to the Netlify serverless function
[[redirects]]
  from = "/:user"
  to = "/.netlify/functions/card"
  status = 200

[[redirects]]
  from = "/:user/:card"
  to = "/.netlify/functions/card"
  status = 200
