<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <defs>
    
    <linearGradient id="stats-ring-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="stats-ring-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#30363d" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="stats-ring-tile-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#21262d" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="stats-ring-brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <radialGradient id="stats-ring-glow-tl" cx="0%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="stats-ring-glow-br" cx="100%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0" />
    </radialGradient>
    <pattern id="stats-ring-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#8b949e" fill-opacity="0.12" />
    </pattern>
  
  </defs>
  <style>
    
    .font-ui { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-weight: 700; font-size: 9px; fill: #8b949e; letter-spacing: 0.08em; text-transform: uppercase; }
    .stat-val { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-weight: 800; font-size: 14px; fill: #58a6ff; font-variant-numeric: tabular-nums; }
    .meta-text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-size: 10.5px; font-weight: 500; fill: #8b949e; }
    @keyframes statusPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    .pulse-dot { animation: statusPulse 2.2s ease-in-out infinite; }
    
  
    .rank-title { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-weight: 700; font-size: 9.5px; fill: #8b949e; text-transform: uppercase; letter-spacing: 0.6px; }
  </style>

  
